name: Deploy Azure Application Gateway WAF

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: rg-application-gateway-waf
          template: ./Infra/main.bicep
          parameters: >
            vm1PrivateIp=${{ secrets.VM1_PRIVATE_IP }}
            vm2PrivateIp=${{ secrets.VM2_PRIVATE_IP }}
